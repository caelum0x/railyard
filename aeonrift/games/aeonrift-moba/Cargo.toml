[package]
name = "aeonrift-moba"
version = "0.1.0"
edition = "2021"
rust-version = "1.96.1"
publish = false
description = "The AEONRIFT MOBA game: authoritative server + predicting client on the deterministic sim core (migrated from moba/server + moba/client, M0/M1 netcode spine)."

[[bin]]
name = "moba-server"
path = "src/bin/moba-server.rs"

# Real-UDP lightyear netcode demo (server | client). Requires the `netcode` feature
# so the default build stays free of the Bevy-0.19 / lightyear dependency graph:
#   cargo +1.96.1 run -p aeonrift-moba --features netcode --bin moba-netcode -- server
[[bin]]
name = "moba-netcode"
path = "src/bin/moba-netcode.rs"
required-features = ["netcode"]

[features]
default = []
# M1.5 netcode: server-authoritative + client prediction/rollback over real UDP
# (lightyear 0.29 + Bevy 0.19). Pulls the Bevy-0.19 world; kept OFF by default so
# `cargo build --workspace` never drags it into the Bevy-0.20-dev engine build.
netcode = ["dep:bevy", "dep:lightyear", "dep:lightyear_deterministic_replication", "dep:seahash"]
# Client-side rendering deps (Bevy 0.19), NON-authoritative and OFF by default for
# the same Bevy-version isolation reason:
#   - vleue_navigator 0.16 : any-angle navmesh visualization,
#   - bevy_egui 0.42       : immediate-mode debug/HUD overlay (see `debug_ui`).
# Client-side navmesh visualization (vleue_navigator 0.16 + Bevy 0.19), NON-
# authoritative. Also OFF by default for the same Bevy-version isolation reason.
# Also enables the leafwing-input-manager 0.21 (Bevy 0.19) action-input VIEW layer
# (`clientinput`) + the client-side cooldown/pool ability UX (`clientability`).
client = ["dep:bevy", "dep:vleue_navigator", "dep:bevy_egui", "dep:leafwing-input-manager"]

[dependencies]
# The deterministic sim core (imported as `sim`): World, step, combat, projectiles,
# state-hash. Every MOBA entity (champion, minion, turret, inhibitor, nexus, jungle
# monster, objective) is a `sim::Champion`, so they all fight through ONE combat core.
aeonrift-sim-core = { path = "../../engine/sim-core" }
# The champion ability DSL. Its lib is named `champions`, so it imports as the
# extern crate `champions`; this crate's own `champions` module reaches it via the
# leading-`::` extern path (`::champions::...`). The dependency key is left as the
# real package name so the repo knowledge-graph's Cargo extractor records a true
# crate->crate edge (a renamed key would create a phantom crate node).
aeonrift-ability-dsl = { path = "../../engine/ability-dsl" }
# Deterministic, Bevy-free flow-field/grid pathfinding over the sim map. Feeds
# move targets straight into `sim::Input`, so lane/minion movement routes around
# obstacles through the SAME deterministic movement core. On an obstacle-free map
# it reduces to the exact straight-line follow (zero behavioural change).
aeonrift-pathfinding = { path = "../../engine/pathfinding" }
# Content is authored as RON (same as champions/abilities). The rules layer loads
# maps, wave profiles, structure/neutral catalogs, and items from content/ with the
# same closed-vocabulary, deny-unknown-fields discipline as the champion DSL.
serde = { version = "1", features = ["derive"] }
ron = "0.12"

# ---------------------------------------------------------------------------
# Bevy-0.19 optional deps — feature-gated so the DEFAULT workspace build (which
# uses the Bevy-0.20-dev engine fork for the lol_* crates) never pulls them.
# lightyear 0.29 + vleue_navigator 0.16 both target Bevy 0.19, so they coexist
# with the 0.20-dev world exactly like the ascendancy Bevy-0.19 client already does.
# ---------------------------------------------------------------------------
bevy = { version = "0.19", optional = true }
lightyear = { version = "0.29", default-features = false, features = [
    "client",
    "server",
    "replication",
    "prediction",
    "interpolation",
    "deterministic",
    "netcode",
    "udp",
    "input_native",
    "std",
], optional = true }
lightyear_deterministic_replication = { version = "0.29", optional = true }
# The exact hasher lightyear's ChecksumPlugin uses (seahash 4.1). We depend on it
# directly (same version lightyear_replication locks) so `SimStateHash`'s
# `add_custom_hash` fn can name `seahash::SeaHasher` — the argument type lightyear
# hands the custom hash function. A mismatched seahash major would be a *different*
# `SeaHasher` type and fail to type-check the hook.
seahash = { version = "4.1", optional = true }
# Client-side navmesh (Polyanya any-angle) for visualization only — never authoritative.
vleue_navigator = { version = "0.16", optional = true }
# Immediate-mode debug/HUD overlay (Bevy 0.19). Default features give the egui
# render + bevy_ui integration; used only under the `client` feature.
bevy_egui = { version = "0.42", optional = true }
# Action-based input mapping (Bevy 0.19). Turns raw keyboard/mouse/touch into the
# game's `MobaAction` verbs (Move / CastQ-R / Recall / Shop / Ping) read as
# `ActionState` in the client VIEW; the deterministic sim stays authoritative.
# leafwing-input-manager 0.21 targets Bevy ^0.19 exactly, so it coexists with the
# 0.20-dev engine world like lightyear / vleue already do — hence the `client` gate.
leafwing-input-manager = { version = "0.21", optional = true }
