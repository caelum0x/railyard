[workspace]
resolver = "2"
members = [
    # --- existing lightweight min-ECS engine (proof path — MUST stay green) ---
    "engine/sim-core",
    "engine/combat",
    "engine/ability-dsl",
    "engine/net",
    "engine/protocol",
    "engine/pathfinding",
    "engine/vision",
    "engine/economy",
    "engine/ai-bots",
    "engine/render",
    "engine/particle",
    "engine/audio-engine",
    "engine/ui-kit",
    "engine/platform",
    "games/aeonrift-moba",
    "games/aeonrift-ascendancy",
    "tools/champion-gen",
    "tools/card-gen",
    "tools/balance-sim",
    "tools/content-lint",
    "tools/asset-cli",
    "tools/localization",
    "tools/mcp",
    "tools/graph",

    # --- migrated moon-lol Bevy engine (real ~800-file engine, original-IP base) ---
    # bevy-free utils
    "engine/league_utils",
    "engine/league_property",
    "engine/league_loader",
    # bevy-free protocol/data
    "engine/lol_share",
    "engine/lol_rl_protocol",
    # gameplay brain (Bevy)
    "engine/lol_base",
    "engine/lol_base_render",
    "engine/lol_core",
    "engine/lol_champions",
    # netcode / server / rpc
    "engine/lol_client",
    "engine/lol_rpc",
    "engine/lol_server",
    # agent runtime (rig/rmcp — no render/Riot deps)
    "engine/lol_agent_runtime",
    # heavy render/particle engine (Bevy 0.20-dev) — DECOUPLED from Riot formats.
    # The Riot WAD/PROP/TEX/.scb loaders (league_core/league_file/league_to_lol) are
    # feature-gated behind the off-by-default `riot-assets` feature; by default these
    # render ORIGINAL glTF (.glb) + Bevy-native meshes. No Riot data/assets copied.
    "engine/lol_render",
    "engine/lol_particle",

    # --- EXCLUDED from workspace members (kept in ../moon-lol; NOT migrated) ---
    # The following moon-lol crates are intentionally NOT members because they
    # depend on heavy/unbuildable deps or on the Riot-data-coupled crates:
    #   lol_debug   -> requires lol_render (debug-only overlay; not needed)
    #   lol_agent   -> requires lol_render + rquickjs (JS scripting engine)
    #   lol_env     -> requires lol_render + lol_particle + lol_agent(rquickjs) + winit
    #   lol_rl      -> requires lol_env (see above chain) + candle-core + postgres/sqlx
    # NOTE: lol_rl's own deps (candle CUDA default, postgres) are the *lesser* blocker;
    # its hard blocker is the lol_env -> lol_agent(rquickjs) chain (see MIGRATION.md).
    # Riot-data-coupled / dev-only crates excluded entirely: league_core, league_file,
    # league_to_lol, lol_extractor, lol_game_process_manager, lol_cli, lol_web_*,
    # apps/client. No Riot WAD/PROP/TEX assets or champion configs copied.
]

[workspace.package]
edition = "2021"
rust-version = "1.96.1"
license = "UNLICENSED"

[workspace.dependencies]
# --- migrated crate path deps (resolve within aeonrift/engine) ---
league_utils = { path = "engine/league_utils" }
league_property = { path = "engine/league_property" }
league_loader = { path = "engine/league_loader" }
lol_share = { path = "engine/lol_share" }
lol_rl_protocol = { path = "engine/lol_rl_protocol" }
lol_base = { path = "engine/lol_base" }
lol_base_render = { path = "engine/lol_base_render" }
lol_core = { path = "engine/lol_core" }
lol_champions = { path = "engine/lol_champions" }
lol_client = { path = "engine/lol_client" }
lol_rpc = { path = "engine/lol_rpc" }
lol_server = { path = "engine/lol_server" }
lol_agent_runtime = { path = "engine/lol_agent_runtime" }
lol_render = { path = "engine/lol_render" }
lol_particle = { path = "engine/lol_particle" }

# --- external deps (versions from moon-lol workspace) ---
bevy = { git = "https://github.com/mutemoon/bevy", branch = "main", features = [
    "dds",
    "tga",
    "webp",
    "free_camera",
    "serialize",
    "bevy_debug_stepping",
    "webgpu",
    "shader_format_spirv",
    "spirv_shader_passthrough",
    "audio",
] }
bincode = "1.3"
bitflags = "2.9.1"
crossbeam-channel = "0.5"
heck = "0.5.0"
image = { version = "0.25", features = ["png"] }
nom = "8.0.0"
rand = "0.9.2"
regex = "1"
clap = { version = "4", features = ["derive"] }
serde = "1.0.219"
thiserror = "2.0.12"
ron = "0.8"
rayon = "1.10"
serde_json = "1.0"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
async-channel = "2"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process", "net"] }
tokio-tungstenite = "0.24"
rmcp = { version = "1.8", features = ["client", "macros", "server"] }
rig = { version = "0.39.0", features = ["rmcp"] }
rig-core = { version = "0.39.0", features = ["rmcp"] }
