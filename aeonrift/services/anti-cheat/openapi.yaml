openapi: "3.0.3"
info:
  title: "aeonrift Anti-Cheat API"
  version: "0.0.0-scaffold"
  description: >-
    Planned surface for services/anti-cheat. Scaffold only — no server behind it yet.
servers:
  - url: "https://api.aeonrift.example/anti-cheat"
    description: placeholder
paths:
  "/v1/signals":
    post:
      summary: "Ingest an integrity signal (divergence, input anomaly)."
      operationId: post_v1_signals
      responses:
        "200":
          description: "OK"
        "401":
          description: "missing/invalid access token"
  "/v1/sessions/{id}/score":
    get:
      summary: "Current risk score + contributing signals."
      operationId: get_v1_sessions_id_score
      responses:
        "200":
          description: "OK"
        "401":
          description: "missing/invalid access token"
  "/v1/enforcements":
    post:
      summary: "Issue an enforcement (warn/suspend/ban) to accounts-auth."
      operationId: post_v1_enforcements
      responses:
        "200":
          description: "OK"
        "401":
          description: "missing/invalid access token"
  "/v1/enforcements/{account_id}":
    get:
      summary: "Enforcement history for an account."
      operationId: get_v1_enforcements_account_id
      responses:
        "200":
          description: "OK"
        "401":
          description: "missing/invalid access token"
