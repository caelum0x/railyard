# infra/docker/docker-compose.yml — SCAFFOLD STUB.
# Local dev backing stores for services/*. Not for production.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aeonrift
      POSTGRES_PASSWORD: devonly   # dev-only placeholder; real secrets never live here
      POSTGRES_DB: aeonrift
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # MinIO stands in for R2 / object storage (replays, patch chunks) in local dev.
  objectstore:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aeonrift
      MINIO_ROOT_PASSWORD: devonly
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - objdata:/data

volumes:
  pgdata:
  objdata:
