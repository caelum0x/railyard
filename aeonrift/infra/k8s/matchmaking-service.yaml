# infra/k8s/matchmaking-service.yaml — SCAFFOLD STUB.
# Representative stateless service: swap image/name for any of services/*.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matchmaking
  namespace: aeonrift
  labels:
    app.kubernetes.io/name: matchmaking
    app.kubernetes.io/part-of: aeonrift
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: matchmaking
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matchmaking
    spec:
      containers:
        - name: matchmaking
          image: registry.example/aeonrift/matchmaking@sha256:PLACEHOLDER
          ports:
            - containerPort: 8080
          env:
            - name: LIVEOPS_URL
              value: http://liveops.aeonrift.svc.cluster.local
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: matchmaking
  namespace: aeonrift
spec:
  selector:
    app.kubernetes.io/name: matchmaking
  ports:
    - port: 80
      targetPort: 8080
