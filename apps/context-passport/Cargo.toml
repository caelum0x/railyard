# Identity Lock — standalone cargo workspace (legacy directory name).
#
# Deliberately NOT a member of the repo-root workspace (the root excludes
# apps/context-passport) so it never enters the desktop GPUI/Metal build graph.
# Build and test only from here: `cd apps/context-passport && cargo test`.
#
# House rules (shared with apps/mint, apps/vend):
#   1. sqlx uses the RUNTIME query API only (`sqlx::query` + `.bind`), never the
#      `query!` macros, so every store crate compiles with no `DATABASE_URL`.
#   2. All HTTP to sibling services (Relay, Mint) goes through injectable
#      transport TRAITS declared in passport-core, faked in tests.

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# ---- internal crates (path deps declared once, referenced as { workspace = true }) ----
passport-core = { path = "crates/passport-core" }
passport-resolve = { path = "crates/passport-resolve" }
passport-provenance = { path = "crates/passport-provenance" }
passport-store = { path = "crates/passport-store" }
passport-store-postgres = { path = "crates/passport-store-postgres" }
passport-relay-client = { path = "crates/passport-relay-client" }
passport-mint-client = { path = "crates/passport-mint-client" }
passport-testkit = { path = "crates/passport-testkit" }
mint-protocol = { path = "../mint/crates/mint-protocol" }

# ---- serde / domain ----
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
thiserror = "2"
sha2 = "0.10"
hex = "0.4"

# ---- async runtime ----
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# ---- HTTP server stack ----
axum = "0.7"
tower-http = { version = "0.6", features = ["trace"] }
subtle = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

# ---- HTTP clients (to Relay / Mint) ----
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# ---- sqlx (runtime API only) ----
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    "chrono",
    "json",
] }

# ---- test-only ----
tower = { version = "0.5", features = ["util"] }
