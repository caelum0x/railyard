[package]
name = "passport-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Identity Lock axum API + service: create/edit/lock/version and receipted Relay generation provenance."

[[bin]]
name = "identity-lock-server"
path = "src/main.rs"

[dependencies]
passport-core = { workspace = true }
passport-resolve = { workspace = true }
passport-provenance = { workspace = true }
passport-store = { workspace = true }
passport-store-postgres = { workspace = true }
passport-relay-client = { workspace = true }

async-trait = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
subtle = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
# Mint receipt signature verification (Ed25519 over the receipt hash) and key
# discovery from the live Mint.
ed25519-dalek = "2"
hex = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
passport-testkit = { workspace = true }
tower = { workspace = true }
