[package]
name = "passport-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Character Lock Passport axum API + service: create/edit/lock/version, resolve, and generate-AS-passport wiring Relay + provenance + Mint."

[[bin]]
name = "context-passport-server"
