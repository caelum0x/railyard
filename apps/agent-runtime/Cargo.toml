[workspace]
resolver = "2"
members = ["crates/*"]

# apps/agent-runtime is its OWN standalone cargo workspace (rig / async stack,
# NO gpui). It is also listed in the repo-root Cargo.toml `exclude` array so that
# no member glob or `cargo build --workspace` from the repo root ever pulls it
# into the desktop GPUI/Metal build graph. Build/test only with:
#   cd apps/agent-runtime && cargo check   (or cargo test)

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.94"

[workspace.dependencies]
# --- Rig runtime -------------------------------------------------------------
# The previously-declared 0.42 path dependency pointed at an absent
# `external/rig` checkout, making even unrelated workspace crates impossible to
# resolve. Use the published, unified 0.39 crate until the 0.42 split crates are
# deliberately vendored.
rig-core = { version = "=0.39.0", default-features = false, features = [
    "reqwest",
    "rustls",
    "derive",
] }

# --- Internal crates ---------------------------------------------------------
aitp-client = { path = "crates/aitp-client" }
relay-provider = { path = "crates/relay-provider" }
agent-core = { path = "crates/agent-core" }

# --- Third-party -------------------------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
base64 = "0.22"
tracing = "0.1"
tokio = { version = "1", features = ["rt", "macros"] }
anyhow = "1"
hex = "0.4"
async-stream = "0.3"
futures-util = "0.3"
