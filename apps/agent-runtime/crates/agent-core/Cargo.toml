[package]
name = "agent-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Base agent runtime for the agent-economy apps (Turnstile/Abacus): rig Agent over Relay + the AITP-402 payment seam."

[dependencies]
rig-core.workspace = true
rig-agent.workspace = true
relay-provider.workspace = true
aitp-client.workspace = true
thiserror.workspace = true
tracing.workspace = true
anyhow.workspace = true
hex.workspace = true

[dev-dependencies]
rig-core = { path = "../../../../external/rig/crates/rig-core", default-features = false, features = [
    "reqwest",
    "rustls",
    "test-utils",
] }
rig-agent = { path = "../../../../external/rig/crates/rig-agent", default-features = false, features = [
    "derive",
    "test-utils",
] }
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }
