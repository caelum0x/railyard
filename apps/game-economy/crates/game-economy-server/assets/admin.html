<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Game Store Operator Console</title>
<style>
  :root {
    --bg: #0f1117; --panel: #181b24; --border: #262b38; --fg: #e6e8ee;
    --muted: #8b91a1; --accent: #6ea8fe; --danger: #f2668b; --ok: #55c98a; --row: #1e222d; --warn: #f2b35a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 20px;
    background: var(--panel); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .spacer { flex: 1; }
  input, button, select, textarea { font: inherit; color: var(--fg); background: var(--row);
    border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; }
  button { cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); color: #0b1020; border-color: var(--accent); font-weight: 600; }
  button.danger { border-color: var(--danger); color: var(--danger); }
  #status { font-size: 12px; color: var(--muted); }
  #status.err { color: var(--danger); } #status.ok { color: var(--ok); }
  nav { display: flex; gap: 4px; padding: 12px 20px 0; }
  nav button { background: transparent; border: 1px solid transparent; border-bottom: none;
    border-radius: 6px 6px 0 0; color: var(--muted); padding: 8px 14px; }
  nav button.active { color: var(--fg); background: var(--panel); border-color: var(--border); }
  main { padding: 0 20px 40px; max-width: 1200px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; padding: 16px 0; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
  .stat .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); font-size: 12px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: auto; margin-top: 16px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 16px 0 0; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  td.mono, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; word-break: break-all; }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .empty, .loading { padding: 28px; color: var(--muted); text-align: center; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 20px; font-size: 11px;
    border: 1px solid var(--border); background: var(--row); text-transform: uppercase; letter-spacing: .4px; }
  .st-completed { color: var(--ok); } .st-refunded { color: var(--accent); } .st-revoked { color: var(--danger); }
  .signin { max-width: 560px; margin: 40px auto; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 20px; }
  .signin input { width: 100%; margin: 10px 0; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 20; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 20px; width: min(520px, 92vw); }
  .modal h3 { margin-top: 0; }
  .modal textarea { width: 100%; min-height: 70px; margin: 8px 0 12px; }
  .row { display: flex; gap: 8px; justify-content: flex-end; }
  h3.section { margin: 20px 0 0; font-size: 14px; }
  .st-active { color: var(--ok); } .st-archived { color: var(--warn); }
  .form-grid { display: grid; grid-template-columns: 150px 1fr; gap: 8px 12px; align-items: center; margin: 12px 0; }
  .form-grid input, .form-grid select { width: 100%; }
  .weights { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .weights label { font-size: 11px; color: var(--muted); display: block; }
  .weights input { width: 100%; }
  .pools { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; margin-top: 12px; }
  .pool { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .pool textarea { width: 100%; min-height: 110px; margin: 6px 0; }
  .err-text { color: var(--danger); font-size: 12px; min-height: 16px; }
  dl.kv { display: grid; grid-template-columns: 150px 1fr; gap: 6px 12px; margin: 0; }
  dl.kv dt { color: var(--muted); font-size: 12px; } dl.kv dd { margin: 0; }
</style>
</head>
<body>
<header>
  <h1>Game Store Operator Console</h1>
  <div class="spacer"></div>
  <span id="status">Ready</span>
  <button id="signout" hidden>Sign out</button>
</header>
<nav id="tabs"></nav>
<main id="main"></main>
<script>
(function () {
  "use strict";
  var TOKEN_KEY = "game_admin_token";
  var state = { token: sessionStorage.getItem(TOKEN_KEY) || "", tab: "overview", filterStatus: "", lookup: "" };
  var main = document.getElementById("main");
  var statusEl = document.getElementById("status");

  function esc(v) { var d = document.createElement("div"); d.textContent = v == null ? "" : String(v); return d.innerHTML; }
  function money(micros) { var n = Number(micros || 0) / 1e6; return (n < 0 ? "-$" : "$") + Math.abs(n).toFixed(2); }
  function setStatus(msg, kind) { statusEl.textContent = msg; statusEl.className = kind || ""; }
  function when(unix) { return unix ? new Date(unix * 1000).toLocaleString() : ""; }

  function api(method, path, body) {
    var opts = { method: method, headers: { "Authorization": "Bearer " + state.token } };
    if (body) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
    return fetch(path, opts).then(function (r) {
      return r.text().then(function (txt) {
        var json = null; try { json = txt ? JSON.parse(txt) : null; } catch (e) { json = null; }
        if (r.status === 401) { signOut(); throw new Error("Admin token rejected. Sign in again."); }
        if (!r.ok || !json || json.success === false) {
          throw new Error(json && json.error ? json.error.message : (txt || ("HTTP " + r.status)));
        }
        return json.data;
      });
    });
  }

  function signOut() { state.token = ""; sessionStorage.removeItem(TOKEN_KEY); render(); }
  document.getElementById("signout").onclick = signOut;

  function renderSignin() {
    main.innerHTML = '<div class="signin"><h2 style="margin-top:0">Operator sign in</h2>' +
      '<p class="muted">Paste the GAME_ADMIN_TOKEN configured on this server. It is kept only in this browser tab.</p>' +
      '<input id="tok" type="password" autocomplete="off" placeholder="Admin token" />' +
      '<button class="primary" id="go">Continue</button></div>';
    var go = function () {
      var t = document.getElementById("tok").value.trim();
      if (!t) { setStatus("Enter the admin token", "err"); return; }
      state.token = t;
      api("GET", "/v1/admin/summary").then(function () {
        sessionStorage.setItem(TOKEN_KEY, t); setStatus("Signed in", "ok"); render();
      }).catch(function (e) { state.token = ""; setStatus(e.message, "err"); });
    };
    document.getElementById("go").onclick = go;
    document.getElementById("tok").onkeydown = function (e) { if (e.key === "Enter") go(); };
  }

  var TABS = [["overview", "Overview"], ["purchases", "Purchases"], ["player", "Player lookup"], ["catalog", "Catalog"]];
  function renderTabs() {
    var nav = document.getElementById("tabs");
    nav.innerHTML = "";
    if (!state.token) return;
    TABS.forEach(function (t) {
      var b = document.createElement("button");
      b.textContent = t[1]; b.className = state.tab === t[0] ? "active" : "";
      b.onclick = function () { state.tab = t[0]; render(); };
      nav.appendChild(b);
    });
  }

  function stat(label, value, sub) {
    return '<div class="stat"><div class="muted">' + esc(label) + '</div><div class="v">' + esc(value) + "</div>" +
      (sub ? '<div class="muted">' + esc(sub) + "</div>" : "") + "</div>";
  }

  function renderOverview() {
    main.innerHTML = '<div class="loading">Loading totals...</div>';
    api("GET", "/v1/admin/summary").then(function (d) {
      var t = d.totals, c = d.catalog;
      main.innerHTML = '<div class="stats">' +
        stat("Gross revenue", money(t.gross_micros), t.completed_purchases + " purchases") +
        stat("Net revenue", money(t.net_micros), "after refunds") +
        stat("Refunded", money(t.refunded_micros), t.refunded_count + " refunds") +
        stat("Revoked", String(t.revoked_count), "chargebacks") +
        stat("Paying players", String(t.players), "") +
        stat("Pending purchases", String(t.pending_purchases), "awaiting Mint settlement or retry") +
        "</div>" +
        '<div class="card"><table><tbody>' +
        '<tr><th>Revenue account</th><td class="mono">' + esc(d.revenue_account) + "</td></tr>" +
        "<tr><th>Catalog</th><td>" + c.products + " products (" + c.card_packs + " packs, " + c.cosmetics + " cosmetics, " + c.battle_passes + " battle passes)" +
          (c.archived ? " &middot; " + c.archived + " archived" : "") + ' &middot; revision ' + esc(c.revision) + "</td></tr>" +
        "</tbody></table></div>";
    }).catch(function (e) { main.innerHTML = '<div class="empty">Could not load totals: ' + esc(e.message) + "</div>"; });
  }

  function statusCell(p) {
    var st = p.status || "completed", rv = p.reversal, html = '<span class="badge st-' + esc(st) + '">' + esc(st) + "</span>";
    if (rv) {
      html += '<div class="muted">' + esc(when(rv.at_unix)) + (rv.kind === "refunded" ? " &middot; " + money(rv.refunded_micros) : "") + "</div>";
      if (rv.reason) html += '<div class="muted">' + esc(rv.reason) + "</div>";
      if (rv.mint_seq != null) html += '<div class="muted mono">Mint seq #' + esc(rv.mint_seq) + "</div>";
    }
    return html;
  }

  function purchaseRows(list, showPlayer) {
    if (!list.length) return '<div class="empty">No purchases match.</div>';
    return '<div class="card"><table><thead><tr>' + (showPlayer ? "<th>Player</th>" : "") +
      "<th>Item</th><th>Charged</th><th>Status</th><th>Settlement</th><th>Receipt</th><th></th></tr></thead><tbody>" +
      list.map(function (p, i) {
        var open = !p.status || p.status === "completed";
        return "<tr>" + (showPlayer ? '<td class="mono"><a href="#" data-player="' + esc(p.player) + '">' + esc(p.player) + "</a></td>" : "") +
          "<td>" + esc(p.product_sku) + '</td><td class="num">' + money(p.charged_micros) + "</td><td>" + statusCell(p) +
          '</td><td class="num">#' + esc(p.settlement_seq) + '</td><td class="mono">' + esc(p.receipt_id) + "</td><td>" +
          '<div class="actions"><button data-detail="' + i + '">Details</button>' +
          (open ? '<button class="primary" data-refund="' + i + '">Refund</button>' +
            '<button class="danger" data-revoke="' + i + '">Revoke</button>' : "") + "</div></td></tr>";
      }).join("") + "</tbody></table></div>";
  }

  function receiptModal(p, inventory) {
    var proof = p.settlement_proof || {};
    var pack = null;
    if (inventory && inventory.packs) pack = inventory.packs[p.entitlement_id] || null;
    var rows = [
      ["Player", p.player], ["Item", p.product_sku], ["Charged", money(p.charged_micros)], ["Status", p.status || "completed"],
      ["Receipt", p.receipt_id], ["Entitlement", p.entitlement_id], ["Mint settlement", "#" + p.settlement_seq]
    ];
    Object.keys(proof).forEach(function (k) {
      var v = proof[k];
      if (v !== null && typeof v !== "object") rows.push(["Proof: " + k, v]);
    });
    if (p.reversal) {
      rows.push(["Reversed", p.reversal.kind + " " + when(p.reversal.at_unix)]);
      if (p.reversal.mint_receipt) rows.push(["Refund receipt", p.reversal.mint_receipt]);
    }
    var html = '<dl class="kv">' + rows.map(function (r) {
      return "<dt>" + esc(r[0]) + '</dt><dd class="mono">' + esc(r[1]) + "</dd>";
    }).join("") + "</dl>";
    if (pack) {
      html += '<h3 class="section">Pack contents</h3>' + (pack.contents
        ? '<div class="card"><table><thead><tr><th>Slot</th><th>Rarity</th><th>Item</th></tr></thead><tbody>' +
          pack.contents.map(function (it) {
            return '<tr><td class="num">' + esc(it.slot + 1) + "</td><td>" + esc(it.rarity) + "</td><td>" + esc(it.name) + "</td></tr>";
          }).join("") + "</tbody></table></div>"
        : '<p class="muted">Sealed: the player has not opened this pack yet.</p>');
    }
    var bg = document.createElement("div");
    bg.className = "modal-bg";
    bg.innerHTML = '<div class="modal" style="width:min(680px,94vw)"><h3>Receipt</h3>' + html +
      '<div class="row" style="margin-top:14px"><button id="close">Close</button></div></div>';
    document.body.appendChild(bg);
    bg.querySelector("#close").onclick = function () { bg.remove(); };
    bg.onclick = function (e) { if (e.target === bg) bg.remove(); };
  }

  function wireRows(list, reload, inventory) {
    main.querySelectorAll("button[data-detail]").forEach(function (b) {
      b.onclick = function () { receiptModal(list[Number(b.dataset.detail)], inventory); };
    });
    main.querySelectorAll("button[data-refund]").forEach(function (b) {
      b.onclick = function () { reverse("refund", list[Number(b.dataset.refund)], reload); };
    });
    main.querySelectorAll("button[data-revoke]").forEach(function (b) {
      b.onclick = function () { reverse("revoke", list[Number(b.dataset.revoke)], reload); };
    });
    main.querySelectorAll("a[data-player]").forEach(function (a) {
      a.onclick = function (e) { e.preventDefault(); state.lookup = a.dataset.player; state.tab = "player"; render(); };
    });
  }

  function reverse(kind, p, reload) {
    var title = kind === "refund"
      ? "Refund " + money(p.charged_micros) + " to " + p.player + "?"
      : "Revoke " + p.product_sku + " from " + p.player + "?";
    var explain = kind === "refund"
      ? "Mint transfers the captured amount from the revenue account back to the player, then the item is removed. This cannot be undone."
      : "The item is removed WITHOUT returning money. Use this only when the payment was already reversed outside Mint (chargeback). The purchase can no longer be refunded.";
    var bg = document.createElement("div");
    bg.className = "modal-bg";
    bg.innerHTML = '<div class="modal"><h3>' + esc(title) + '</h3><p class="muted">' + esc(explain) + "</p>" +
      '<label class="muted">Reason (recorded on the purchase)</label><textarea id="reason" maxlength="500"></textarea>' +
      '<div class="row"><button id="cancel">Cancel</button><button class="' + (kind === "refund" ? "primary" : "danger") + '" id="confirm">' +
      (kind === "refund" ? "Refund" : "Revoke") + "</button></div></div>";
    document.body.appendChild(bg);
    var close = function () { bg.remove(); };
    bg.querySelector("#cancel").onclick = close;
    bg.querySelector("#confirm").onclick = function () {
      var btn = bg.querySelector("#confirm"); btn.disabled = true;
      setStatus(kind === "refund" ? "Refunding through Mint..." : "Revoking...");
      api("POST", kind === "refund" ? "/v1/admin/refunds" : "/v1/admin/revoke",
        { player: p.player, receipt_id: p.receipt_id, reason: bg.querySelector("#reason").value.trim() || null })
        .then(function (d) {
          close();
          if (kind === "refund") setStatus(d.idempotent_replay ? "Already refunded" : "Refunded " + money(p.charged_micros), "ok");
          else setStatus(d.already_reversed ? "Purchase was already reversed" : "Revoked", "ok");
          reload();
        })
        .catch(function (e) { btn.disabled = false; setStatus(e.message, "err"); });
    };
  }

  function renderPurchases() {
    main.innerHTML = '<div class="toolbar"><label class="muted">Status</label><select id="st">' +
      ["", "completed", "refunded", "revoked"].map(function (s) {
        return '<option value="' + s + '"' + (state.filterStatus === s ? " selected" : "") + ">" + (s || "All") + "</option>";
      }).join("") + '</select><button id="reload">Reload</button></div><div id="list"><div class="loading">Loading purchases...</div></div>';
    document.getElementById("st").onchange = function (e) { state.filterStatus = e.target.value; renderPurchases(); };
    document.getElementById("reload").onclick = renderPurchases;
    var q = "/v1/admin/purchases?limit=200" + (state.filterStatus ? "&status=" + encodeURIComponent(state.filterStatus) : "");
    api("GET", q).then(function (d) {
      document.getElementById("list").innerHTML = purchaseRows(d.purchases, true);
      wireRows(d.purchases, renderPurchases);
    }).catch(function (e) { document.getElementById("list").innerHTML = '<div class="empty">Could not load purchases: ' + esc(e.message) + "</div>"; });
  }

  function renderPlayer() {
    main.innerHTML = '<div class="toolbar"><input id="pl" placeholder="Player Mint account id" style="min-width:320px" value="' + esc(state.lookup) + '" />' +
      '<button class="primary" id="find">Look up</button></div><div id="out"></div>';
    var out = document.getElementById("out");
    var find = function () {
      var id = document.getElementById("pl").value.trim();
      if (!id) { out.innerHTML = '<div class="empty">Enter a player account id.</div>'; return; }
      state.lookup = id;
      out.innerHTML = '<div class="loading">Loading player...</div>';
      api("GET", "/v1/admin/players/" + encodeURIComponent(id)).then(function (d) {
        var inv = d.inventory || {}, packs = Object.keys(inv.packs || {}), cos = Object.keys(inv.cosmetics || {});
        var html = '<h3 class="section">Inventory</h3><div class="card"><table><tbody>' +
          "<tr><th>Packs</th><td>" + packs.length + " (" + packs.filter(function (k) { return !inv.packs[k].contents; }).length + " unopened)</td></tr>" +
          "<tr><th>Cosmetics</th><td>" + (cos.length ? cos.map(function (k) { return esc(inv.cosmetics[k]); }).join(", ") : '<span class="muted">none</span>') + "</td></tr>" +
          "<tr><th>Battle pass</th><td>" + (inv.battle_pass
            ? esc(inv.battle_pass.pass_sku) + " &middot; tier " + esc(inv.battle_pass.tier) +
              ' <input id="tier" type="number" min="0" style="width:90px;margin-left:8px" value="' + esc(inv.battle_pass.tier) + '" /> <button id="adv">Set tier</button>'
            : '<span class="muted">none</span>') + "</td></tr>" +
          "</tbody></table></div>";
        html += '<h3 class="section">Purchases</h3>' + purchaseRows(d.purchases, false);
        out.innerHTML = html;
        wireRows(d.purchases, find, inv);
        var adv = document.getElementById("adv");
        if (adv) adv.onclick = function () {
          var tier = Number(document.getElementById("tier").value);
          if (!Number.isInteger(tier) || tier < 0) { setStatus("Tier must be a whole number", "err"); return; }
          adv.disabled = true;
          api("POST", "/v1/admin/pass/advance", { player: id, pass_sku: inv.battle_pass.pass_sku, tier: tier })
            .then(function (r) { setStatus("Battle pass now at tier " + r.tier, "ok"); find(); })
            .catch(function (e) { adv.disabled = false; setStatus(e.message, "err"); });
        };
      }).catch(function (e) { out.innerHTML = '<div class="empty">Could not load player: ' + esc(e.message) + "</div>"; });
    };
    document.getElementById("find").onclick = find;
    document.getElementById("pl").onkeydown = function (e) { if (e.key === "Enter") find(); };
    if (state.lookup) find();
  }

  // ---- Catalog editor ----------------------------------------------------
  var RARITIES = ["Common", "Uncommon", "Rare", "Epic", "Legendary"];
  var KIND_LABEL = { card_pack: "Card pack", cosmetic: "Cosmetic", battle_pass: "Battle pass" };
  var catalogState = { revision: null, products: [], pools: {} };

  function productSummary(p) {
    var d = p.details, inner = d.CardPack || d.Cosmetic || d.BattlePass || {};
    if (d.CardPack) return inner.cards_per_pack + " cards &middot; " + inner.rarity_weights.map(function (w) {
      return esc(w[0]) + " " + esc(w[1]);
    }).join(", ");
    if (d.Cosmetic) return esc(inner.slot) + " slot &middot; " + esc(inner.rarity);
    if (d.BattlePass) return esc(inner.tiers) + " tiers";
    return "";
  }

  function renderCatalog() {
    main.innerHTML = '<div class="toolbar"><select id="newkind">' +
      '<option value="card_pack">Card pack</option><option value="cosmetic">Cosmetic</option><option value="battle_pass">Battle pass</option>' +
      '</select><button class="primary" id="newprod">New product</button><button id="reload">Reload</button>' +
      '<span class="muted" id="rev"></span></div><div id="prods"><div class="loading">Loading catalog...</div></div>' +
      '<h3 class="section">Item pools</h3><p class="muted">Pack drops pick a named item from the pool of the rarity they roll. Every rarity a pack can roll must have at least one item. One item per line.</p>' +
      '<div class="pools" id="pools"></div>';
    document.getElementById("reload").onclick = renderCatalog;
    document.getElementById("newprod").onclick = function () { productModal(null, document.getElementById("newkind").value); };
    api("GET", "/v1/admin/catalog").then(showCatalog).catch(function (e) {
      document.getElementById("prods").innerHTML = '<div class="empty">Could not load the catalog: ' + esc(e.message) + "</div>";
    });
  }

  function showCatalog(d) {
    catalogState = d;
    var rev = document.getElementById("rev");
    if (!rev) return;
    rev.textContent = "Revision " + d.revision + " \u00b7 edits apply to the live storefront immediately";
    var list = d.products;
    document.getElementById("prods").innerHTML = !list.length ? '<div class="empty">The catalog has no products.</div>' :
      '<div class="card"><table><thead><tr><th>SKU</th><th>Type</th><th>Name</th><th>Price</th><th>Details</th><th>Status</th><th></th></tr></thead><tbody>' +
      list.map(function (p, i) {
        return '<tr><td class="mono">' + esc(p.sku) + "</td><td>" + esc(KIND_LABEL[p.kind] || p.kind) + "</td><td>" + esc(p.name) +
          '</td><td class="num">' + money(p.price_micros) + "</td><td>" + productSummary(p) + "</td><td>" +
          '<span class="badge st-' + (p.archived ? "archived" : "active") + '">' + (p.archived ? "archived" : "on sale") + "</span></td>" +
          '<td><div class="actions"><button data-edit="' + i + '">Edit</button>' +
          '<button class="' + (p.archived ? "primary" : "danger") + '" data-arch="' + i + '">' + (p.archived ? "Restore" : "Archive") + "</button></div></td></tr>";
      }).join("") + "</tbody></table></div>";
    main.querySelectorAll("button[data-edit]").forEach(function (b) {
      b.onclick = function () { var p = list[Number(b.dataset.edit)]; productModal(p, p.kind); };
    });
    main.querySelectorAll("button[data-arch]").forEach(function (b) {
      b.onclick = function () { toggleArchive(list[Number(b.dataset.arch)], b); };
    });
    document.getElementById("pools").innerHTML = RARITIES.map(function (r) {
      var items = (d.pools && d.pools[r]) || [];
      return '<div class="pool"><strong>' + esc(r) + '</strong> <span class="muted">' + items.length + " items</span>" +
        '<textarea data-pool="' + r + '">' + esc(items.join("\n")) + "</textarea>" +
        '<div class="err-text" data-poolerr="' + r + '"></div><button data-savepool="' + r + '">Save ' + esc(r.toLowerCase()) + " pool</button></div>";
    }).join("");
    main.querySelectorAll("button[data-savepool]").forEach(function (b) {
      b.onclick = function () { savePool(b.dataset.savepool, b); };
    });
  }

  function catalogConflict(e) {
    return /changed concurrently|revision/i.test(e.message);
  }

  function toggleArchive(p, btn) {
    var archive = !p.archived;
    var msg = archive
      ? "Archive " + p.sku + "? It disappears from the storefront and can no longer be bought. Copies players already own keep working."
      : "Restore " + p.sku + " to the storefront?";
    if (!window.confirm(msg)) return;
    btn.disabled = true;
    api("POST", "/v1/admin/catalog/products/" + encodeURIComponent(p.sku) + "/archive",
      { archived: archive, expected_revision: catalogState.revision })
      .then(function (d) { setStatus(archive ? "Archived " + p.sku : "Restored " + p.sku, "ok"); showCatalog(d); })
      .catch(function (e) {
        btn.disabled = false; setStatus(e.message, "err");
        if (catalogConflict(e)) renderCatalog();
      });
  }

  function savePool(rarity, btn) {
    var ta = main.querySelector('textarea[data-pool="' + rarity + '"]');
    var errEl = main.querySelector('[data-poolerr="' + rarity + '"]');
    var items = ta.value.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
    errEl.textContent = "";
    btn.disabled = true;
    api("PUT", "/v1/admin/catalog/pools/" + rarity.toLowerCase(), { items: items, expected_revision: catalogState.revision })
      .then(function (d) { setStatus(rarity + " pool saved (" + items.length + " items)", "ok"); showCatalog(d); })
      .catch(function (e) { btn.disabled = false; errEl.textContent = e.message; setStatus(e.message, "err"); });
  }

  function productModal(existing, kind) {
    var inner = existing ? (existing.details.CardPack || existing.details.Cosmetic || existing.details.BattlePass) : null;
    var editing = !!existing;
    var weights = {};
    RARITIES.forEach(function (r) { weights[r] = 0; });
    if (inner && inner.rarity_weights) inner.rarity_weights.forEach(function (w) { weights[w[0]] = w[1]; });
    else if (!editing && kind === "card_pack") { weights = { Common: 60, Uncommon: 25, Rare: 10, Epic: 4, Legendary: 1 }; }
    var price = inner ? (inner.price_micros / 1e6).toFixed(2) : "";
    var fields = '<div class="form-grid">' +
      '<label class="muted">SKU</label><input id="f-sku" class="mono" placeholder="e.g. pack.gold" value="' + esc(inner ? inner.sku : "") + '"' + (editing ? " disabled" : "") + " />" +
      '<label class="muted">Display name</label><input id="f-name" maxlength="120" value="' + esc(inner ? inner.name : "") + '" />' +
      '<label class="muted">Price (USD)</label><input id="f-price" type="number" min="0.01" step="0.01" value="' + esc(price) + '" />';
    if (kind === "card_pack") {
      fields += '<label class="muted">Cards per pack</label><input id="f-cards" type="number" min="1" max="100" value="' + esc(inner ? inner.cards_per_pack : 5) + '" />' +
        '<label class="muted">Drop weights</label><div class="weights">' + RARITIES.map(function (r) {
          return "<div><label>" + esc(r) + '</label><input type="number" min="0" data-w="' + r + '" value="' + esc(weights[r]) + '" /></div>';
        }).join("") + "</div>";
    } else if (kind === "cosmetic") {
      fields += '<label class="muted">Slot</label><input id="f-slot" placeholder="weapon, back, emote..." value="' + esc(inner ? inner.slot : "") + '" />' +
        '<label class="muted">Rarity</label><select id="f-rarity"' + (editing ? " disabled" : "") + ">" + RARITIES.map(function (r) {
          return "<option" + (inner && inner.rarity === r ? " selected" : "") + ">" + r + "</option>";
        }).join("") + "</select>";
    } else {
      fields += '<label class="muted">Reward tiers</label><input id="f-tiers" type="number" min="1" value="' + esc(inner ? inner.tiers : 100) + '" />';
    }
    fields += "</div>";
    var note = kind === "card_pack"
      ? "Odds changes apply to packs bought from now on; packs already sold keep the odds they were bought under."
      : kind === "cosmetic"
        ? (editing ? "Name and rarity are the item's identity and are locked. To change them, archive this SKU and create a new one." : "The name and rarity become the item's permanent identity.")
        : (editing ? "Tier count can grow but not shrink below " + inner.tiers + "." : "");
    var bg = document.createElement("div");
    bg.className = "modal-bg";
    bg.innerHTML = '<div class="modal" style="width:min(640px,94vw)"><h3>' + (editing ? "Edit " : "New ") + esc(KIND_LABEL[kind].toLowerCase()) + "</h3>" +
      fields + (note ? '<p class="muted">' + esc(note) + "</p>" : "") + '<div class="err-text" id="f-err"></div>' +
      '<div class="row"><button id="cancel">Cancel</button><button class="primary" id="save">' + (editing ? "Save changes" : "Create") + "</button></div></div>";
    document.body.appendChild(bg);
    if (editing && kind === "cosmetic") bg.querySelector("#f-name").disabled = true;
    var errEl = bg.querySelector("#f-err");
    bg.querySelector("#cancel").onclick = function () { bg.remove(); };
    bg.querySelector("#save").onclick = function () {
      var sku = bg.querySelector("#f-sku").value.trim();
      var name = bg.querySelector("#f-name").value.trim();
      var priceMicros = Math.round(Number(bg.querySelector("#f-price").value) * 1e6);
      if (!sku || /\s/.test(sku)) { errEl.textContent = "SKU is required and cannot contain spaces."; return; }
      if (!name) { errEl.textContent = "Display name is required."; return; }
      if (!(priceMicros > 0)) { errEl.textContent = "Price must be greater than zero."; return; }
      var product;
      if (kind === "card_pack") {
        var cards = Number(bg.querySelector("#f-cards").value);
        if (!Number.isInteger(cards) || cards < 1 || cards > 100) { errEl.textContent = "Cards per pack must be 1 to 100."; return; }
        var rw = [], total = 0, bad = false;
        RARITIES.forEach(function (r) {
          var w = Number(bg.querySelector('[data-w="' + r + '"]').value);
          if (!Number.isInteger(w) || w < 0) bad = true;
          else if (w > 0) { rw.push([r, w]); total += w; }
        });
        if (bad || total === 0) { errEl.textContent = "Weights must be whole numbers and at least one must be above zero."; return; }
        product = { CardPack: { sku: sku, name: name, price_micros: priceMicros, cards_per_pack: cards, rarity_weights: rw } };
      } else if (kind === "cosmetic") {
        var slot = bg.querySelector("#f-slot").value.trim();
        if (!slot) { errEl.textContent = "Slot is required."; return; }
        product = { Cosmetic: { sku: sku, name: name, price_micros: priceMicros, slot: slot, rarity: bg.querySelector("#f-rarity").value } };
      } else {
        var tiers = Number(bg.querySelector("#f-tiers").value);
        if (!Number.isInteger(tiers) || tiers < 1) { errEl.textContent = "Tiers must be a whole number of at least 1."; return; }
        product = { BattlePass: { sku: sku, name: name, price_micros: priceMicros, tiers: tiers } };
      }
      if (!editing && catalogState.products.some(function (p) { return p.sku === sku; })) {
        errEl.textContent = "A product with this SKU already exists. Edit it instead."; return;
      }
      var btn = bg.querySelector("#save"); btn.disabled = true; errEl.textContent = "";
      api("PUT", "/v1/admin/catalog/products/" + encodeURIComponent(sku), { product: product, expected_revision: catalogState.revision })
        .then(function (d) { bg.remove(); setStatus((editing ? "Saved " : "Created ") + sku, "ok"); showCatalog(d); })
        .catch(function (e) {
          btn.disabled = false; errEl.textContent = e.message;
          if (catalogConflict(e)) errEl.textContent += " Close this dialog and reload the catalog.";
        });
    };
  }

  function render() {
    document.getElementById("signout").hidden = !state.token;
    renderTabs();
    if (!state.token) return renderSignin();
    if (state.tab === "overview") return renderOverview();
    if (state.tab === "purchases") return renderPurchases();
    if (state.tab === "catalog") return renderCatalog();
    return renderPlayer();
  }

  render();
})();
</script>
</body>
</html>
