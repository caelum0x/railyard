# apps/game-economy — a GAME storefront that settles card packs, cosmetics/skins
# and a battle-pass on Railyard's Mint rail.
#
# This is its OWN standalone cargo workspace, mirroring `apps/mint`, `apps/abacus`
# and `apps/vend`, so building it never pulls the game crates into any other app's
# build graph.
#
# HARD RULE (identical to Abacus): the game store is a REAL Mint consumer. Every
# purchase is a success-only, receipted hold -> capture through an injectable
# `MintTransport` seam (real HTTP client in prod, faithful FakeMint in tests).
# The store NEVER reimplements the ledger — it reuses Mint's hold/capture/release
# semantics exactly (hold reserves, capture settles terminal-once, release frees).
#
# Build/test from here ONLY:  cd apps/game-economy && cargo test
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# --- shared serde / domain deps ---
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
async-trait = "0.1.89"

# --- content addressing (same hash Mint uses for receipts/merkle) ---
blake3 = "1.8.5"

# --- async runtime (tests) ---
tokio = { version = "1.52.3", features = ["full"] }

# --- HTTP server stack (game-economy-server binary) ---
axum = "0.7"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

# --- real HTTP Mint client (prod transport) ---
# Mirrors apps/abacus's abacus-mint-client: rustls TLS, JSON bodies, no default
# features so we never pull in native-tls / OpenSSL.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }

# --- Postgres game state (game-economy-store-postgres) ---
# RUNTIME query API only (sqlx::query + .bind), never the query! macros, so the
# crate compiles with no live DATABASE_URL. Same feature set as the other
# Railyard sqlx consumers (context-passport, turnstile).
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    "json",
] }

# --- internal path deps (the game-economy crate graph) ---
game-economy-core = { path = "crates/game-economy-core" }
game-economy-testkit = { path = "crates/game-economy-testkit" }
game-economy-mint-client = { path = "crates/game-economy-mint-client" }
game-economy-store = { path = "crates/game-economy-store" }
game-economy-store-postgres = { path = "crates/game-economy-store-postgres" }
mint-protocol = { path = "../mint/crates/mint-protocol" }
