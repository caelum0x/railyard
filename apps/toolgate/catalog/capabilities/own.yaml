- id: llm.chat
  title: LLM chat completion
  description: A chat completion from any model on Relay, billed on the same key and balance.
  tags: [llm, chat, completion, gpt, claude, model, ai, generate, text]
  input_schema:
    type: object
    properties:
      model: { type: string, minLength: 1, maxLength: 200 }
      messages:
        type: array
        minItems: 1
        maxItems: 200
        items:
          type: object
          properties:
            role: { type: string, enum: [system, user, assistant] }
            content: { type: string }
          required: [role, content]
      max_tokens: { type: integer, minimum: 1, maximum: 32000 }
      temperature: { type: number, minimum: 0, maximum: 2 }
    required: [model, messages]
    additionalProperties: false
  output_schema:
    type: object
    properties:
      content: { type: [string, "null"] }
      model: { type: [string, "null"] }
      usage: { type: [object, "null"] }

- id: db.query
  title: Read-only SQL query
  description: Run a read-only SQL query on a Scribase project database environment or branch.
  tags: [sql, database, postgres, query, select, scribase, data]
  input_schema:
    type: object
    properties:
      organization: { type: string, minLength: 1 }
      project: { type: string, minLength: 1 }
      environment: { type: string, minLength: 1, default: production }
      query: { type: string, minLength: 1, maxLength: 20000 }
      limit: { type: integer, minimum: 1, maximum: 1000, default: 100 }
    required: [organization, project, query]
    additionalProperties: false
  output_schema:
    type: object
    properties:
      columns: { type: [array, "null"] }
      rows: { type: [array, "null"] }

- id: db.branch
  title: Create a database branch
  description: Create a copy-on-write Scribase database branch for an agent task.
  tags: [branch, database, copy, fork, scribase, postgres, sandbox]
  input_schema:
    type: object
    properties:
      organization: { type: string, minLength: 1 }
      project: { type: string, minLength: 1 }
      environment_id: { type: string, minLength: 1, description: New branch environment id }
      base_environment_id: { type: string, minLength: 1, default: production }
    required: [organization, project, environment_id]
    additionalProperties: false
  output_schema: { type: object }

- id: auth.magic_link
  title: Send a sign-in magic link
  description: Send a passwordless sign-in link to an app user of a Scribase project.
  tags: [auth, login, magic, link, signin, passwordless, otp, scribase]
  input_schema:
    type: object
    properties:
      project_url: { type: string, pattern: "^https://" }
      email: { type: string, format: email, maxLength: 320 }
      redirect_to: { type: string, pattern: "^https://" }
    required: [project_url, email]
    additionalProperties: false
  output_schema:
    type: object
    properties:
      sent: { type: boolean }
    required: [sent]

- id: email.verify
  title: Verify an email address
  description: Check an email address for valid syntax, a mail server (MX), disposable and role-account signals.
  tags: [email, verify, validate, deliverability, mx, bounce, lead]
  input_schema:
    type: object
    properties:
      email: { type: string, minLength: 3, maxLength: 320 }
    required: [email]
    additionalProperties: false
  output_schema:
    type: object
    properties:
      email: { type: string }
      result: { type: string, enum: [deliverable, risky, undeliverable] }
      checks: { type: object }
    required: [email, result, checks]

- id: email.send
  title: Send a transactional email
  description: Send one transactional email from a verified sender domain through Rally (unsubscribe footer enforced, rate-limited).
  tags: [email, send, mail, transactional, notify, outbound]
  input_schema:
    type: object
    properties:
      from: { type: string, minLength: 3, maxLength: 320 }
      to:
        anyOf:
          - { type: string, minLength: 3, maxLength: 320 }
          - { type: array, items: { type: string }, minItems: 1, maxItems: 50 }
      subject: { type: string, maxLength: 998 }
      html: { type: string, maxLength: 500000 }
      text: { type: string, maxLength: 500000 }
      reply_to: { type: string, maxLength: 320 }
      template_id: { type: string }
      variables: { type: object }
    required: [from, to]
    additionalProperties: false
  output_schema: { type: object }

- id: video.render
  title: Render a short video
  description: Script or subject to a rendered short video (async job; poll video.status).
  tags: [video, render, generate, tiktok, reel, short, ugc, menivor]
  input_schema:
    type: object
    properties:
      subject: { type: string, minLength: 2, maxLength: 500 }
      script: { type: string, maxLength: 20000 }
      aspect: { type: string, enum: ["9:16", "16:9", "1:1"], default: "9:16" }
      voice: { type: string, maxLength: 120 }
      language: { type: string, maxLength: 10 }
      duration_s: { type: integer, minimum: 5, maximum: 180, default: 30 }
    required: [subject]
    additionalProperties: false
  output_schema:
    type: object
    properties:
      job_id: { type: string }
      status: { type: string }
    required: [job_id]

- id: video.status
  title: Video job status
  description: Poll a Menivor render job for progress and the final video URLs. Free.
  tags: [video, status, poll, job, render, progress]
  input_schema:
    type: object
    properties:
      job_id: { type: string, minLength: 1, maxLength: 120 }
    required: [job_id]
    additionalProperties: false
  output_schema:
    type: object
    properties:
      job_id: { type: string }
      state: { type: [string, integer, "null"] }
      progress: { type: [number, integer, "null"] }
      videos: { type: [array, "null"] }

- id: speech.tts
  title: Text to speech
  description: Turn text into spoken audio (edge-tts class voices) and return an audio URL or job.
  tags: [tts, voice, speech, audio, narration, speak, voiceover]
  input_schema:
    type: object
    properties:
      text: { type: string, minLength: 1, maxLength: 20000 }
      voice: { type: string, maxLength: 120, default: en-US-AriaNeural-Female }
      language: { type: string, maxLength: 10 }
      rate: { type: number, minimum: 0.5, maximum: 2.0, default: 1.0 }
    required: [text]
    additionalProperties: false
  output_schema:
    type: object
    properties:
      job_id: { type: [string, "null"] }
      audio_url: { type: [string, "null"] }
