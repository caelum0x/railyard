- id: research.papers.search
  title: Search research papers
  description: Find scholarly papers by keywords with title, authors, year, DOI or link.
  tags: [papers, research, academic, scholar, science, arxiv, citations]
  input_schema:
    type: object
    properties:
      q: { type: string, minLength: 2, maxLength: 300 }
      limit: { type: integer, minimum: 1, maximum: 50, default: 10 }
    required: [q]
    additionalProperties: false
  output_schema:
    type: object
    properties:
      results:
        type: array
        items:
          type: object
          properties:
            title: { type: [string, "null"] }
            authors: { type: array }
            year: { type: [integer, string, "null"] }
            url: { type: [string, "null"] }
            doi: { type: [string, "null"] }
    required: [results]

- id: dev.repo.search
  title: Search code repositories
  description: Search GitHub repositories by keywords, sorted by stars.
  tags: [github, repo, repository, code, open, source, oss, library]
  input_schema:
    type: object
    properties:
      q: { type: string, minLength: 1, maxLength: 256 }
      limit: { type: integer, minimum: 1, maximum: 50, default: 10 }
      sort: { type: string, enum: [stars, updated, best-match], default: stars }
    required: [q]
    additionalProperties: false
  output_schema:
    type: object
    properties:
      total: { type: [integer, "null"] }
      results:
        type: array
        items:
          type: object
          properties:
            name: { type: [string, "null"] }
            url: { type: [string, "null"] }
            description: { type: [string, "null"] }
            stars: { type: [integer, "null"] }
            language: { type: [string, "null"] }
    required: [results]

- id: dev.package.info
  title: Package registry info
  description: Latest version, description, license and links for a package on npm, PyPI or crates.io.
  tags: [npm, pypi, crates, package, library, version, registry, dependency]
  input_schema:
    type: object
    properties:
      ecosystem: { type: string, enum: [npm, pypi, crates] }
      name: { type: string, minLength: 1, maxLength: 214, pattern: "^[@A-Za-z0-9._/-]+$" }
    required: [ecosystem, name]
    additionalProperties: false
  output_schema:
    type: object
    properties:
      ecosystem: { type: string }
      name: { type: string }
      version: { type: [string, "null"] }
      description: { type: [string, "null"] }
      license: { type: [string, "null"] }
      homepage: { type: [string, "null"] }
      repository: { type: [string, "null"] }
    required: [ecosystem, name]
