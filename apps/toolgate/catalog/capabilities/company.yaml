- id: company.filings
  title: Company SEC filings
  description: Recent SEC EDGAR filings (10-K, 10-Q, 8-K ...) for a US-listed company by ticker or CIK.
  tags: [sec, edgar, filing, 10k, annual, report, public, company, ticker]
  input_schema:
    type: object
    properties:
      ticker: { type: string, pattern: "^[A-Za-z.\\-]{1,10}$" }
      cik: { type: string, pattern: "^[0-9]{1,10}$" }
      form: { type: string, maxLength: 12, description: "Only this form type, e.g. 10-K" }
      limit: { type: integer, minimum: 1, maximum: 100, default: 20 }
    anyOf:
      - required: [ticker]
      - required: [cik]
    additionalProperties: false
  output_schema:
    type: object
    properties:
      cik: { type: string }
      name: { type: [string, "null"] }
      filings: { type: array }
    required: [cik, filings]

- id: company.identity
  title: Legal entity identifier (LEI)
  description: Look up a company's legal entity record (LEI, legal name, jurisdiction, address, status) by name or LEI.
  tags: [lei, gleif, legal, entity, company, registry, kyc, identity]
  input_schema:
    type: object
    properties:
      name: { type: string, minLength: 2, maxLength: 200 }
      lei: { type: string, pattern: "^[A-Z0-9]{20}$" }
      limit: { type: integer, minimum: 1, maximum: 50, default: 10 }
    anyOf:
      - required: [name]
      - required: [lei]
    additionalProperties: false
  output_schema:
    type: object
    properties:
      results: { type: array }
    required: [results]

- id: company.enrich
  title: Enrich a company from its domain
  description: Company profile (name, industry, size, location, socials) from a website domain.
  tags: [enrich, company, domain, firmographic, profile, lead, b2b]
  input_schema:
    type: object
    properties:
      domain: { type: string, pattern: "^[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$" }
    required: [domain]
    additionalProperties: false
  output_schema:
    type: object
    properties:
      domain: { type: string }
      company: { type: [object, "null"] }
    required: [domain]

- id: leads.search
  title: Search companies and people (leads)
  description: Search Rally's lawful company and people data (registries, places, VC database) by filters.
  tags: [leads, prospect, people, company, b2b, sales, outbound, contacts]
  input_schema:
    type: object
    properties:
      kind: { type: string, enum: [companies, people], default: companies }
      filters: { type: object, description: "Rally filters, e.g. {industry, country, employees}" }
      domains: { type: array, items: { type: string }, maxItems: 100 }
      limit: { type: integer, minimum: 1, maximum: 100, default: 25 }
    additionalProperties: false
  output_schema:
    type: object
    properties:
      results: { type: array }
      total: { type: [integer, "null"] }
    required: [results]
