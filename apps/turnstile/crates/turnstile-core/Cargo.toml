[package]
name = "turnstile-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Framework-agnostic AITP-402 paywall engine: config, challenge, nonce replay-guard, server-side verifier over the reused HttpTransport seam, success-only settle, and the admit() guard."

[dependencies]
aitp-client.workspace = true
# `time` is enabled for the durable store's background nonce reaper (spawn_reaper).
tokio = { workspace = true, features = ["time"] }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rand.workspace = true
hex = "0.4"
# x402 `X-PAYMENT` / `X-PAYMENT-RESPONSE` headers are base64-encoded JSON.
base64 = "0.22"

# Durable Postgres NonceStore, off by default. Enabling `postgres` pulls in sqlx
# (runtime query API, no DATABASE_URL needed) and compiles the `pg` module.
sqlx = { workspace = true, optional = true }

[features]
default = []
postgres = ["dep:sqlx"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
