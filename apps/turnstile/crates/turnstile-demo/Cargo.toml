[package]
name = "turnstile-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reference Turnstile server: one paid endpoint (POST /v1/echo) gated by turnstile-axum plus an open /healthz, wiring ReqwestTransport to a live mint-server to prove the full 402 -> verify -> capture loop."

[[bin]]
name = "turnstile-demo"
path = "src/main.rs"

[dependencies]
turnstile-core = { workspace = true, features = ["postgres"] }
turnstile-axum.workspace = true
aitp-client.workspace = true
axum.workspace = true
tokio.workspace = true
serde_json.workspace = true
serde.workspace = true
# Upstream proxying for config-declared paid tools.
reqwest.workspace = true

[dev-dependencies]
# e2e_paywall.rs runs the full 402 -> authorize (REAL aitp-client Ed25519 signer +
# codec) -> verify -> capture loop against a FakeMintTransport at the seam.
turnstile-core.workspace = true
turnstile-axum.workspace = true
aitp-client.workspace = true
axum.workspace = true
tower = { workspace = true, features = ["util"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
async-trait.workspace = true
serde_json.workspace = true
