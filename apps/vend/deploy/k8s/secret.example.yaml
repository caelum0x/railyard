  VEND_ADMIN_TOKEN_SHA256: "replace-with-64-hex-digest"
  VEND_ADMIN_TOKEN_NEXT_SHA256: ""
  VEND_RATE_LIMIT_PEPPER_HEX: "replace-with-dedicated-64-hex-secret"
  VEND_CLEARING_ACCOUNT: "acct_replace"
  VEND_PROVIDER_PAYOUT_ACCOUNT: "acct_replace"
  VEND_PLATFORM_PAYOUT_ACCOUNT: "acct_replace"
  VEND_MODEL_RATES_JSON: '{}'
  VEND_GITHUB_CLIENT_ID: ""
  VEND_GITHUB_CLIENT_SECRET: ""
  VEND_GOOGLE_CLIENT_ID: ""
  VEND_GOOGLE_CLIENT_SECRET: ""
