[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reelforge-vend"
version = "0.1.0"
description = "Dependency-free Python client for the Vend control and metered inference APIs"
requires-python = ">=3.11"
license = {text = "Proprietary"}

[tool.setuptools.packages.find]
where = ["src"]
