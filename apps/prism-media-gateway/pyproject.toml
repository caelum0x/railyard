[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-media-gateway"
version = "0.1.0"
description = "OpenAI-shaped image and video gateway over ReelForge routing"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "loguru>=0.7",
  "pydantic>=2.10",
  "requests>=2.32",
  "sqlalchemy>=2.0",
  "uvicorn>=0.34",
]

[tool.setuptools.packages.find]
include = ["prism_gateway*"]
