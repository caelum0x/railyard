[package]
name = "rit"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Library-first Rust implementation of the Git loose-object model: read, write, verify, and traverse standard Git repositories"
rust-version = "1.74"

# Standalone by design: never join a parent Cargo workspace.
[workspace]

[lib]
name = "rit"
path = "src/lib.rs"

[[bin]]
name = "rit"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
sha1 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
