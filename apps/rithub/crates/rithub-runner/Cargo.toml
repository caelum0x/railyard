[package]
name = "rithub-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The rithub CI runner: reads .rithub/workflows/*.yml at a commit, runs each job's steps, and reports check runs to the forge."

[lib]
path = "src/lib.rs"

[[bin]]
name = "rithub-runner"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true, features = ["process", "time", "io-util"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["process", "time", "io-util", "macros", "rt-multi-thread"] }
