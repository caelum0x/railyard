[package]
name = "forge-search"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Full-text search (Tantivy) over repositories, issues, pull requests, commits, and blob content, plus pure-Rust syntax highlighting (syntect) for blob and diff rendering. Owns no HTTP or database concerns."

[dependencies]
serde.workspace = true
thiserror.workspace = true
# Full-text index. Pure Rust; the on-disk index lives next to the repo data.
tantivy = "0.26"
# Syntax highlighting. `default-fancy` selects the pure-Rust `fancy-regex`
# engine (no C oniguruma), so highlighting builds and runs fully offline.
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

[dev-dependencies]
tempfile = "3"
