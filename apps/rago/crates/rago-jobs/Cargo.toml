[package]
name = "rago-jobs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rago background jobs — subscription billing orchestration"

[lib]
name = "rago_jobs"
path = "src/lib.rs"

[[bin]]
name = "rago-scheduler"
path = "src/bin/scheduler.rs"

[[bin]]
name = "rago-worker"
path = "src/bin/worker.rs"

[[bin]]
name = "rago-clock"
path = "src/bin/clock.rs"

[dependencies]
rago-core.workspace = true
rago-db.workspace = true
rago-billing.workspace = true
rago-integrations.workspace = true
tokio.workspace = true
chrono.workspace = true
uuid.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
sqlx.workspace = true

[features]
# Real outbound HTTP (provider charges + webhook delivery) for the job binaries.
live = ["rago-integrations/live"]
# Opt-in Postgres-backed #[sqlx::test] suites (need DATABASE_URL; see README
# "Running the tests"). Plain `cargo test` skips them.
pg-tests = []
