[package]
name = "relay-billing"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
# The Mint-backed `MintLedger` speaks HTTP to mint-server via an injected
# transport; `ReqwestTransport` is the production implementation.
reqwest = { workspace = true }
# The public `mint::fake` test-support transport polls with `tokio::time::sleep`
# in its `wait_for` helper, so tokio is a normal (not dev-only) dependency.
tokio = { workspace = true }
uuid = { workspace = true }
# Compatibility import alias backed by Relay's owned AITP wire crate.
aitp-client = { package = "relay-aitp-wire", path = "../relay-aitp-wire" }
ed25519-dalek = "2"
hex = "0.4"

[dev-dependencies]
tokio = { workspace = true }
