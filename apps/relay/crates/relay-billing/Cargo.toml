[package]
name = "relay-billing"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
# The Mint-backed `MintLedger` speaks HTTP to mint-server via an injected
# transport; `ReqwestTransport` is the production implementation.
reqwest = { workspace = true }
# The public `mint::fake` test-support transport polls with `tokio::time::sleep`
# in its `wait_for` helper, so tokio is a normal (not dev-only) dependency.
tokio = { workspace = true }
# NB: the workspace `uuid` only enables the `v7` feature, but the ported ledger
# mints v4 ids (`Uuid::new_v4`). Declare `uuid` directly with `v4` rather than
# inheriting `uuid = { workspace = true }`, or the crate will not compile.
uuid = { version = "1.22.0", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { workspace = true }
