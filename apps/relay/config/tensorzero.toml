# Relay's active Neon + Cloudflare R2 runtime config. Direct provider model
# names remain available; add operator-owned model/function tables below as the
# product catalog is promoted. Provider secrets come from the Providers page
# (encrypted in Postgres) or the environment; never from this file.
[gateway]
bind_address = "0.0.0.0:3000"
# Relay is independent of TensorZero's hosted services (see OWNERSHIP.md): never
# send pseudonymous usage analytics to howdy.tensorzero.com.
disable_pseudonymous_usage_analytics = true

# Gateway API-key authentication. Required for every Relay money/metering path:
# `RELAY_BILLING_ENABLED` and `RELAY_METERING_ENABLED` both abort startup without
# it, and the billing dashboard resolves spend by the calling key. Keys live in
# Postgres (`TENSORZERO_POSTGRES_URL`) and are created from the UI's API Keys
# page or `gateway --create-api-key`. Give the UI its own key via
# `TENSORZERO_API_KEY` and list that key's public id in `RELAY_OPERATOR_KEY_IDS`
# so the dashboard can aggregate spend across all keys.
[gateway.auth]
enabled = true

[gateway.observability]
enabled = true
backend = "postgres"

[object_storage]
type = "s3_compatible"
bucket_name = "env::R2_BUCKET_NAME"
region = "auto"
endpoint = "env::R2_S3_ENDPOINT"

# ┌────────────────────────────────────────────────────────────────────────────┐
# │                                   MODELS                                    │
# │                                                                             │
# │ Operator-owned catalog. No secret is ever written into config. Every        │
# │ provider resolves its key as a `dynamic::relay_*_api_key` credential that   │
# │ the gateway supplies per request (crates/gateway/src/provider_keys.rs):     │
# │ the key stored on the Providers page (AES-256-GCM under                     │
# │ RELAY_CREDENTIALS_KEY) or, when none is stored, the named env variable      │
# │ (GROQ_API_KEY, OPENROUTER_API_KEY, ANTHROPIC_API_KEY, OPENAI_API_KEY).      │
# │                                                                             │
# │ ANY SUBSET OF KEYS BOOTS. No location here reads `env::` directly, so a     │
# │ missing provider key never aborts startup. A provider without a key is     │
# │ DISABLED: a request whose every route needs a disabled provider is refused │
# │ with HTTP 503 `provider_not_configured`, and the Providers page / startup  │
# │ log show it as "Not configured". Trade-off: batch-status polling carries   │
# │ no request credentials, so batch inference needs a key stored in Relay.   │
# │                                                                             │
# │ FAILOVER. Each model routes to its primary provider first and to OpenRouter │
# │ second: when the primary errors (outage, 5xx, exhausted retries, open       │
# │ circuit, or no key) TensorZero retries the request on the next provider.   │
# │ Billing prices the Relay model name (`tensorzero::model_name::<name>`), so  │
# │ the retail price is identical whichever provider served the request.       │
# │                                                                             │
# │ COST-FIRST DEFAULT. Groq's free tier serves `functions.chat` and the        │
# │ unpinned `passport_text` default; OpenRouter is the free failover leg.     │
# └────────────────────────────────────────────────────────────────────────────┘

# Shorthand names (`tensorzero::model_name::groq::llama-3.3-70b-versatile`,
# what Rally and Menivor send) use these per-provider-type defaults, so they
# resolve through the same Relay credential slots as the named models below.
[provider_types.groq.defaults]
api_key_location = "dynamic::relay_groq_api_key"

[provider_types.openrouter.defaults]
api_key_location = "dynamic::relay_openrouter_api_key"

[provider_types.anthropic.defaults]
api_key_location = "dynamic::relay_anthropic_api_key"

[provider_types.openai.defaults]
api_key_location = "dynamic::relay_openai_api_key"

# Groq free-tier models. Named after the Groq model id so a shorthand request
# for the same id whose provider has no key (e.g. Menivor's
# `tensorzero::model_name::openai::llama-3.3-70b-versatile`) is resolved to this
# catalog entry by the gateway instead of failing.
[models."llama-3.3-70b-versatile"]
routing = ["groq", "openrouter"]

[models."llama-3.3-70b-versatile".providers.groq]
type = "groq"
model_name = "llama-3.3-70b-versatile"
api_key_location = "dynamic::relay_groq_api_key"

[models."llama-3.3-70b-versatile".providers.openrouter]
type = "openrouter"
model_name = "meta-llama/llama-3.3-70b-instruct:free"
api_key_location = "dynamic::relay_openrouter_api_key"

[models."llama-3.1-8b-instant"]
routing = ["groq", "openrouter"]

[models."llama-3.1-8b-instant".providers.groq]
type = "groq"
model_name = "llama-3.1-8b-instant"
api_key_location = "dynamic::relay_groq_api_key"

[models."llama-3.1-8b-instant".providers.openrouter]
type = "openrouter"
model_name = "meta-llama/llama-3.1-8b-instruct"
api_key_location = "dynamic::relay_openrouter_api_key"

[models."gpt-4o-mini"]
routing = ["openai", "openrouter"]

[models."gpt-4o-mini".providers.openai]
type = "openai"
model_name = "gpt-4o-mini"
api_key_location = "dynamic::relay_openai_api_key"

[models."gpt-4o-mini".providers.openrouter]
type = "openrouter"
model_name = "openai/gpt-4o-mini"
api_key_location = "dynamic::relay_openrouter_api_key"

[models."gpt-4o"]
routing = ["openai", "openrouter"]

[models."gpt-4o".providers.openai]
type = "openai"
model_name = "gpt-4o"
api_key_location = "dynamic::relay_openai_api_key"

[models."gpt-4o".providers.openrouter]
type = "openrouter"
model_name = "openai/gpt-4o"
api_key_location = "dynamic::relay_openrouter_api_key"

[models."claude-sonnet"]
routing = ["anthropic", "openrouter"]

[models."claude-sonnet".providers.anthropic]
type = "anthropic"
model_name = "claude-sonnet-4-5"
api_key_location = "dynamic::relay_anthropic_api_key"

[models."claude-sonnet".providers.openrouter]
type = "openrouter"
model_name = "anthropic/claude-sonnet-4.5"
api_key_location = "dynamic::relay_openrouter_api_key"

# ┌────────────────────────────────────────────────────────────────────────────┐
# │                              EMBEDDING MODELS                               │
# └────────────────────────────────────────────────────────────────────────────┘

[embedding_models."text-embedding-3-small"]
routing = ["openai", "openrouter"]

[embedding_models."text-embedding-3-small".providers.openai]
type = "openai"
model_name = "text-embedding-3-small"
api_key_location = "dynamic::relay_openai_api_key"

[embedding_models."text-embedding-3-small".providers.openrouter]
