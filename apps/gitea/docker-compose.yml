# apps/gitea — Railyard's code-hosting service: the official go-gitea/gitea
# image (MIT) + Postgres. Replaces the from-scratch "Rithub + Rit" build
# (apps/rit, apps/rithub — Rust, preserved, not deleted) per
# plans/OSS-ADOPTION-2026-10-15.md.
#
# app.ini is generated entirely from GITEA__<SECTION>__<KEY> environment
# variables (Gitea's "environment-to-ini" mechanism) — no app.ini file is
# committed. Branding overrides (logo, footer, locale strings) live in
# ./custom and are bind-mounted over the persistent /data volume's
# gitea/custom subdirectory, Gitea's documented customization path.
#
# Local proof (this machine): HTTP on 3300, SSH on 2222 (both non-default to
# avoid clashing with other local services / the eventual Oracle box's :22).
# Production (Oracle ARM box): see deploy/RUNBOOK.md — same compose file,
# Cloudflare Tunnel in front of HTTP, SSH opened on a non-22 port in the
# box's security list.
#
# Usage:
#   cd apps/gitea
#   cp .env.example .env   # fill in secrets (or export them)
#   docker compose up -d
#   docker compose exec gitea gitea admin user create --admin \
#     --username <name> --password <pass> --email <email>

services:
  gitea-postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: ${GITEA_DB_PASSWORD:-gitea}
      POSTGRES_DB: gitea
    volumes:
      - gitea-pgdata:/var/lib/postgresql/data
    ports:
      - "${GITEA_DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea -d gitea"]
      interval: 5s
      timeout: 5s
      retries: 10

  gitea:
    image: gitea/gitea:${GITEA_IMAGE_TAG:-1.23}
    restart: unless-stopped
    depends_on:
      gitea-postgres:
        condition: service_healthy
    environment:
      USER_UID: 1000
      USER_GID: 1000
      # --- identity / branding -------------------------------------------------
      # APP_NAME has no [section] in app.ini (it's a top-of-file root key), so
      # the environment-to-ini mapping uses an empty section segment:
      # GITEA + "__" + "" + "__" + APP_NAME.
      GITEA____APP_NAME: "Rithub (by Railyard)"
      GITEA__server__DOMAIN: ${GITEA_DOMAIN:-git.ereboslab.com}
      GITEA__server__ROOT_URL: ${GITEA_ROOT_URL:-https://git.ereboslab.com/}
      GITEA__server__SSH_DOMAIN: ${GITEA_DOMAIN:-git.ereboslab.com}
      # SSH_PORT is the port advertised in clone URLs / the UI; the container
      # itself always listens on :22 via the base image's passthrough OpenSSH
      # (the default — do NOT also set START_SSH_SERVER=true, Gitea's own
      # built-in SSH server, or the two fight over :22 and crash-loop).
      GITEA__server__SSH_PORT: ${GITEA_SSH_PUBLIC_PORT:-2222}
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__DISABLE_SSH: "false"
      GITEA__server__LFS_START_SERVER: "true"
      # --- database -------------------------------------------------------------
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea-postgres:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD:-gitea}
      # --- secrets (required in production; generate with
      #     `docker compose run --rm gitea gitea generate secret SECRET_KEY` /
      #     `... INTERNAL_TOKEN`) -----------------------------------------------
      GITEA__security__SECRET_KEY: ${GITEA_SECRET_KEY:-dev-only-secret-key-change-me}
      GITEA__security__INTERNAL_TOKEN: ${GITEA_INTERNAL_TOKEN:-dev-only-internal-token-change-me}
      # DB/branding are fully supplied above; skip the interactive install
      # wizard and boot straight into normal run mode.
      GITEA__security__INSTALL_LOCK: "true"
      # --- packages / LFS / wiki / actions (the Dec 21/28 roadmap scope) --------
      GITEA__packages__ENABLED: "true"
      GITEA__packages__LIMIT_TOTAL_OWNER_COUNT: "-1"
      GITEA__repository__DISABLE_DOWNLOAD_SOURCE_ARCHIVES: "false"
      GITEA__repository__DEFAULT_PRIVATE: "private"
      GITEA__actions__ENABLED: "true"
      GITEA__actions__DEFAULT_ACTIONS_URL: github
      # --- accounts: native Gitea auth, or Railyard SSO once registered --------
      # CLOSED (backlog item 5, was TODO(railyard-sso)): apps/console now
      # exposes a real OIDC discovery endpoint (lib/oidc.ts, /oidc/{authorize,
      # token,userinfo,jwks}). Register it once RAILYARD_OIDC_SIGNING_KEY and
      # RAILYARD_OIDC_CLIENTS (client_id "railyard-id" below) are set on
      # console:
      #   docker compose exec gitea gitea admin auth add-oauth \
      #     --name railyard-id --provider openidConnect \
      #     --key railyard-id --secret <the RAILYARD_OIDC_CLIENTS secret> \
      #     --auto-discover-url https://railyard.ereboslab.com/.well-known/openid-configuration \
      #     --group-claim-name groups --admin-group railyard-admins
      # The redirect_uri Gitea will present is
      # <GITEA_ROOT_URL>user/oauth2/railyard-id/callback -- it must exactly
      # match the redirect_uri configured for "railyard-id" in console's
      # RAILYARD_OIDC_CLIENTS. Native accounts stay available alongside this;
      # the webhook-bridge billing hook (integrations/railyard/) is unaffected
      # either way.
      GITEA__service__DISABLE_REGISTRATION: ${GITEA_DISABLE_REGISTRATION:-false}
      GITEA__service__REGISTER_EMAIL_CONFIRM: "false"
      GITEA__openid__ENABLE_OPENID_SIGNIN: "false"
      GITEA__mailer__ENABLED: "false"
    volumes:
      - gitea-data:/data
      # The official Docker image collapses Gitea's normal "custom/" override
      # dir straight into /data/gitea (CustomPath == WorkPath in this image,
      # NOT /data/gitea/custom) — bind-mount only the public/templates
      # subpaths, never the whole /data/gitea, or this would shadow conf/,
      # the sqlite/log dirs and ssh host keys that live there too.
      - ./custom/public:/data/gitea/public:ro
      - ./custom/templates:/data/gitea/templates:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${GITEA_HTTP_HOST_PORT:-3300}:3000"
      - "${GITEA_SSH_HOST_PORT:-2222}:22"

  # Gitea Actions CI runner (closes the "forge CI runners" gap from
  # plans/OSS-ADOPTION-2026-10-15.md — Gitea's built-in Actions covers the
  # pipeline definition/UI, this is what actually *executes* a pushed
  # `.gitea/workflows/*.yml` job; without it the Actions tab is cosmetic).
  # `profiles: [actions]` keeps this out of a bare `docker compose up -d`
  # (it must be started by name: `docker compose up -d act_runner`) — a
  # fresh clone/box must never fail to bring up gitea+postgres just because
  # a runner token doesn't exist yet. Requires a one-time registration token:
  #   docker compose exec -u git gitea gitea actions generate-runner-token
  # then put it in .env as GITEA_RUNNER_TOKEN before the up -d above. Token
  # is consumed on first boot: act_runner persists its signed credentials in
  # the gitea-runner-data volume (`.runner` file) and reconnects with those
  # on every restart, so the token env var is only read once per fresh
  # volume. Starting this with GITEA_RUNNER_TOKEN still unset/blank is safe
  # (no required-var interpolation failure that could block the rest of the
  # stack) — act_runner just exits/restarts with a clear "no token" error
  # until a real one is set.
  act_runner:
    image: gitea/act_runner:${ACT_RUNNER_IMAGE_TAG:-0.6.1}
    profiles: ["actions"]
    restart: unless-stopped
    depends_on: [gitea]
    environment:
      # Internal compose-network hostname, not the public HTTPS URL — the
      # runner calls Gitea's gRPC/HTTP registration+task API directly inside
      # the shared docker network, so it doesn't depend on the public DNS
      # name, TLS termination, or Cloudflare being reachable from the box's
      # own loopback. Override only if act_runner runs on a different host
      # than the gitea container (e.g. a dedicated runner box).
      GITEA_INSTANCE_URL: ${ACT_RUNNER_INSTANCE_URL:-http://gitea:3000}
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_TOKEN:-}
      GITEA_RUNNER_NAME: ${GITEA_RUNNER_NAME:-railyard-box}
      # No CONFIG_FILE: act_runner runs fine on its built-in defaults from
      # just the env vars above (DooD via the mounted socket, default
      # `ubuntu-latest`-style labels) — a mounted config.yaml is only
      # needed to override those defaults, which nothing here requires yet.
    volumes:
      - gitea-runner-data:/data
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  gitea-pgdata:
  gitea-data:
  gitea-runner-data:
