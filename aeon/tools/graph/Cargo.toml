[package]
name = "aeonrift-graph"
version = "0.1.0"
edition = "2021"
rust-version = "1.96.1"
publish = false
description = "AEONRIFT-GRAPH.md: repo knowledge-graph extractor (ontology -> extract -> validate -> fuse -> GraphRAG serve) over the monorepo (Cargo + champion RON + asset manifests)."

# The graph query CLI: `cargo run -p aeonrift-graph --bin graph -- <cmd>`
[[bin]]
name = "graph"
path = "src/bin/graph.rs"

[dependencies]
# Reuse, do not reinvent: parse champion specs through the real DSL loader so the
# graph's closed effect vocabulary IS the game's closed effect vocabulary.
aeonrift-ability-dsl = { path = "../../engine/ability-dsl" }
# TOML for the Cargo dependency graph; RON for champion specs + asset manifests.
toml = "0.8"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Optional real LLM client for `graph ask`. Kept behind a feature so the default
# build + tests need no network and no API key — the RAG layer talks to any LLM
# through the injectable `rag::Ask` seam.
reqwest = { version = "0.12", features = ["blocking", "json"], optional = true }

[features]
default = []
# Wire the default Anthropic-backed `rag::llm::DefaultAsk` into `graph ask`.
llm = ["dep:reqwest"]
