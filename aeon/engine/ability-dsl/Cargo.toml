[package]
name = "aeonrift-ability-dsl"
version = "0.1.0"
edition = "2021"
rust-version = "1.96.1"
publish = false
description = "M5: declarative champion/ability DSL compiling DOWN to the deterministic sim combat core, plus a spec-driven duel harness (migrated from moba/champions)."

# Package is branded `aeonrift-ability-dsl`; the library imports as `champions`
# so the migrated call-sites (`use champions::...`) and the `duel` bin stay unchanged.
[lib]
name = "champions"
path = "src/lib.rs"

# Spec-driven duel CLI: `cargo run -p aeonrift-ability-dsl --bin duel -- <spec_a.ron> <spec_b.ron> --seed 42`
[[bin]]
name = "duel"
path = "src/bin/duel.rs"

[dependencies]
# The DSL compiles down to the deterministic sim combat core (imported as `sim`).
aeonrift-sim-core = { path = "../sim-core" }
# RON is Rust-native, supports comments, and rejects unknown enum variants — which
# IS our closed effect-vocabulary validation.
serde = { version = "1", features = ["derive"] }
ron = "0.12"
